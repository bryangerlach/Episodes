<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Episodes</title>
    <!-- Include Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body text-body d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body text-center">
                        
                        <!-- Larger App Icon Header -->
                        <div class="mb-3 d-inline-block">
                            <svg width="300" height="300" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                                <!-- Background -->
                                <rect x="48" y="48" width="928" height="928" rx="220" fill="#1e293b"/>
                                <rect x="60" y="60" width="904" height="904" rx="200" fill="none" stroke="#334155" stroke-width="8"/>
                                <!-- TV Body -->
                                <rect x="220" y="280" width="584" height="512" rx="40" fill="#e2e8f0"/>
                                <!-- TV Screen -->
                                <rect x="275" y="330" width="474" height="377" rx="20" fill="#0f172a"/>
                                <!-- 4-Line Checklist -->
                                <rect x="342" y="410" width="18" height="24" rx="3" fill="#38bdf8"/>
                                <rect x="375" y="420" width="90" height="10" rx="3" fill="#38bdf8"/>
                                
                                <rect x="342" y="465" width="18" height="24" rx="3" fill="none" stroke="#94a3b8" stroke-width="4"/>
                                <rect x="375" y="475" width="90" height="10" rx="3" fill="#94a3b8"/>
                                
                                <rect x="342" y="520" width="18" height="24" rx="3" fill="none" stroke="#94a3b8" stroke-width="4"/>
                                <rect x="375" y="530" width="90" height="10" rx="3" fill="#94a3b8"/>

                                <rect x="342" y="575" width="18" height="24" rx="3" fill="none" stroke="#94a3b8" stroke-width="4"/>
                                <rect x="375" y="585" width="90" height="10" rx="3" fill="#94a3b8"/>
                                <!-- Bold Uppercase E -->
                                <text x="555" y="565" font-family="Arial, sans-serif" font-weight="bold" font-size="230" fill="#38bdf8" text-anchor="middle">E</text>
                                <!-- Status Light -->
                                <circle cx="754" cy="742" r="8" fill="#22c55e"/>
                                <!-- TV Stand -->
                                <rect x="442" y="792" width="140" height="18" rx="6" fill="#94a3b8"/>
                            </svg>
                        </div>

                        <h2 class="mb-4 fw-bold">Episodes</h2>
                        
                        <form method="post" class="text-start">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" name="username" id="username" class="form-control" required autofocus>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p class="text-muted mb-0">Don't have an account? <a href="/user_action?action=register" class="text-decoration-none">Register</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to automatically apply the user's theme cookie on page load -->
    <script>
        function getCookie(name) {
            let cookieArr = document.cookie.split(";");
            for(let i = 0; i < cookieArr.length; i++) {
                let cookiePair = cookieArr[i].split("=");
                if(name == cookiePair[0].trim()) {
                    return decodeURIComponent(cookiePair[1]);
                }
            }
            return "";
        }

        let myTheme = getCookie("theme");
        if (myTheme === "") {
            myTheme = "dark"; // Default fallback
        }
        document.documentElement.setAttribute('data-bs-theme', myTheme);
    </script>
</body>
</html>
